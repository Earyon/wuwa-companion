<script>
let DATA=[];
let WEAPONS=[];

const CATALOG_VERSION="0.5.7";
const CATALOG_CACHE_KEY="wwc_catalog_canonical_v050";
const ENCORE_BASE="https://api-v2.encore.moe/api";
let catalogState={status:"loading",source:"Encore API / WW_Data",error:null,gameVersion:null,resourceVersion:null};

function content(v){
  if(v==null)return "";
  if(typeof v==="string"||typeof v==="number")return String(v);
  return String(v.Content ?? v.content ?? v.Name ?? v.name ?? "");
}
function first(obj,keys){
  for(const k of keys) if(obj && obj[k]!=null && obj[k]!=="") return obj[k];
  return null;
}
function normalizeType(v){
  const raw=content(v).trim().toLowerCase().replace(/[\s_-]+/g,"");
  const map={
    sword:"Sword", longsword:"Sword",
    broadblade:"Broadblade", broadblades:"Broadblade",
    pistols:"Pistols", pistol:"Pistols",
    gauntlets:"Gauntlets", gauntlet:"Gauntlets",
    rectifier:"Rectifier", rectifiers:"Rectifier"
  };
  return map[raw]||null;
}
function normalizeElement(v){
  const raw=content(v).trim().toLowerCase();
  const map={aero:"Aero",electro:"Electro",fusion:"Fusion",glacio:"Glacio",havoc:"Havoc",spectro:"Spectro"};
  return map[raw]||null;
}
function assetUrl(v){
  if(v==null)return "";
  if(typeof v==="object"){
    v=v.Url ?? v.URL ?? v.url ?? v.Path ?? v.path ?? v.Icon ?? v.icon ?? v.Content ?? v.content ?? "";
  }
  let p=String(v||"").trim();
  if(!p)return "";
  if(/^https?:\/\//i.test(p))return p;
  p=p.split(".")[0];
  if(p.startsWith("/Game/Aki/")) return "https://api.encore.moe/resource/Data"+p+".webp";
  if(p.startsWith("Game/Aki/")) return "https://api.encore.moe/resource/Data/"+p+".webp";
  return p;
}
function quality(v){
  const n=Number(v);
  if([1,2,3,4,5].includes(n))return n;
  const m=content(v).match(/[1-5]/); return m?Number(m[0]):null;
}
function stableId(prefix,id,name){
  if(id!=null && String(id)!=="")return `${prefix}:${id}`;
  return `${prefix}:`+String(name).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}
function listFrom(payload,keys){
  if(Array.isArray(payload))return payload;
  for(const k of keys) if(Array.isArray(payload?.[k])) return payload[k];
  return [];
}
function normalizeWeapon(w){
  const name=content(first(w,["WeaponName","Name","name"]));
  const id=first(w,["ItemId","Id","id","WeaponId"]);
  return {
    id:stableId("weapon",id,name),
    gameId:id==null?null:String(id),
    name,
    rarity:quality(first(w,["QualityId","Quality","Rarity","rarity"])),
    type:normalizeType(first(w,["WeaponTypeName","WeaponType","TypeName","type"])),
    image:assetUrl(first(w,["IconSmall","IconMiddle","Icon","icon"]))
  };
}
function normalizeCharacter(r){
  const name=content(first(r,["Name","RoleName","name"]));
  const id=first(r,["Id","RoleId","id"]);
  return {
    id:stableId("resonator",id,name),
    gameId:id==null?null:String(id),
    name,
    rarity:quality(first(r,["QualityId","Quality","Rarity","rarity"])),
    weapon:normalizeType(first(r,["WeaponTypeName","WeaponType","weaponType","WeaponName"])),
    element:normalizeElement(first(r,["ElementName","Element","AttributeName","element"])),
    gender:content(first(r,["Gender","Sex","gender","sex"])).trim(),
    image:assetUrl(first(r,["RoleHeadIconCircle","RoleHeadIcon","Icon","RoleHeadIconBig","icon"]))
  };
}

function isRover(r){
 return /^rover(?:\s*:|\s*$)/i.test(String(r?.name||"").trim());
}
const VERIFIED_MALE_ROVER_IDS=new Set(["1406","1501","1605"]);
function keepPlayableMaleRovers(chars){
 const groups=new Map(), others=[];
 for(const r of chars){
   if(!isRover(r)){others.push(r);continue}
   const key=r.element||String(r.name).replace(/^rover\s*:?\s*/i,"").trim()||"Unknown";
   if(!groups.has(key))groups.set(key,[]);
   groups.get(key).push(r);
 }
 for(const [element,group] of groups){
   if(group.length===1){others.push(group[0]);continue}
   // 1) Prefer explicit canonical gender metadata.
   let chosen=group.find(r=>/^(male|man|m|男)$/i.test(String(r.gender||"").trim()));
   // 2) Verified game IDs for existing Rover elements.
   if(!chosen)chosen=group.find(r=>VERIFIED_MALE_ROVER_IDS.has(String(r.gameId||"")));
   // 3) Never expose both genders. If a future element arrives before gender metadata
   // is available, retain one deterministic entry and flag it internally for review.
   if(!chosen){
     chosen=[...group].sort((a,b)=>String(a.gameId||a.id).localeCompare(String(b.gameId||b.id),undefined,{numeric:true}))[0];
     chosen._genderFallback=true;
   }
   others.push(chosen);
 }
 return others;
}
function validateCanonical(chars,weapons){
  const errors=[];
  const types=new Set(["Sword","Broadblade","Pistols","Gauntlets","Rectifier"]);
  const elements=new Set(["Aero","Electro","Fusion","Glacio","Havoc","Spectro"]);
  const ids=new Set();
  for(const w of weapons){
    if(!w.id||ids.has(w.id))errors.push(`weapon duplicate/missing id ${w.name}`); ids.add(w.id);
    if(!w.name)errors.push(`weapon ${w.id}: missing name`);
    if(!types.has(w.type))errors.push(`${w.name}: missing/invalid canonical type`);
    if(![1,2,3,4,5].includes(w.rarity))errors.push(`${w.name}: missing/invalid rarity`);
  }
  const rids=new Set();
  for(const r of chars){
    if(!r.id||rids.has(r.id))errors.push(`resonator duplicate/missing id ${r.name}`); rids.add(r.id);
    if(!r.name)errors.push(`resonator ${r.id}: missing name`);
    if(!types.has(r.weapon))errors.push(`${r.name}: missing/invalid weapon type`);
    if(!elements.has(r.element))errors.push(`${r.name}: missing/invalid element`);
    if(![4,5].includes(r.rarity))errors.push(`${r.name}: missing/invalid rarity`);
  }
  // Catalogue sanity checks: block obviously partial/broken upstream responses.
  if(weapons.length<120)errors.push(`weapon catalogue unexpectedly small: ${weapons.length}`);
  if(chars.length<55)errors.push(`resonator catalogue unexpectedly small: ${chars.length}`);
  if(errors.length) throw new Error(errors.slice(0,12).join(" | ")+(errors.length>12?` | +${errors.length-12} more`:""));
}
async function fetchJSON(url){
  const res=await fetch(url,{cache:"no-store"});
  if(!res.ok)throw new Error(`HTTP ${res.status} — ${url}`);
  return res.json();
}

async function fetchCanonicalLists(newPayload=null){
  const [weaponPayload,charPayload]=await Promise.all([
    fetchJSON(`${ENCORE_BASE}/en/weapon`),
    fetchJSON(`${ENCORE_BASE}/en/character`)
  ]);
  const rawWeapons=listFrom(weaponPayload,["weapons","weaponList","data"]);
  const rawChars=listFrom(charPayload,["roleList","characters","characterList","data"]);
  const nw=rawWeapons.map(normalizeWeapon).filter(x=>x.name);
  const nc=keepPlayableMaleRovers(rawChars.map(normalizeCharacter).filter(x=>x.name));
  validateCanonical(nc,nw);
  DATA=nc; WEAPONS=nw;
  catalogState={
    status:"ready",source:"Encore API / WW_Data",error:null,
    gameVersion:first(newPayload,["GameVer","gameVersion"])||null,
    resourceVersion:first(newPayload,["ResVer","resourceVersion"])||null,
    updatedAt:new Date().toISOString()
  };
  localStorage.setItem(CATALOG_CACHE_KEY,JSON.stringify({
    savedAt:new Date().toISOString(),state:catalogState,characters:DATA,weapons:WEAPONS
  }));
  updateHealth();
}
function restoreValidatedCache(){
  try{
    const cached=JSON.parse(localStorage.getItem(CATALOG_CACHE_KEY)||"null");
    if(!cached?.characters?.length || !cached?.weapons?.length) return false;
    validateCanonical(cached.characters,cached.weapons);
    DATA=keepPlayableMaleRovers(cached.characters); WEAPONS=cached.weapons;
    migrateOwnershipToCanonical();
    catalogState={...cached.state,status:"cached",error:null,savedAt:cached.savedAt};
    updateHealth();
    return true;
  }catch(e){
    console.warn("Rejected catalogue cache",e);
    return false;
  }
}
function updateHealth(){
  window.__WWC_DATA_HEALTH__={
    ok:true,catalogVersion:CATALOG_VERSION,
    source:catalogState.source,status:catalogState.status,
    gameVersion:catalogState.gameVersion,resourceVersion:catalogState.resourceVersion,
    resonators:DATA.length,weapons:WEAPONS.length
  };
}
async function refreshCanonicalCatalog({force=false}={}){
  try{
    const newPayload=await fetchJSON(`${ENCORE_BASE}/en/new`).catch(()=>null);
    const newGame=first(newPayload,["GameVer","gameVersion"])||null;
    const newRes=first(newPayload,["ResVer","resourceVersion"])||null;
    const sameVersion=!force && DATA.length && WEAPONS.length &&
      newGame && newRes &&
      String(newGame)===String(catalogState.gameVersion) &&
      String(newRes)===String(catalogState.resourceVersion);
    if(sameVersion){
      catalogState={...catalogState,status:"cached",error:null,lastChecked:new Date().toISOString()};
      updateHealth();
      return {changed:false};
    }
    await fetchCanonicalLists(newPayload);
    return {changed:true};
  }catch(err){
    if(DATA.length && WEAPONS.length){
      catalogState={...catalogState,status:"cached",error:String(err)};
      updateHealth();
      return {changed:false,error:err};
    }
    catalogState={status:"error",source:"Encore API / WW_Data",error:String(err)};
    throw err;
  }
}
async function bootstrapCanonicalCatalog(){
  const hadCache=restoreValidatedCache();
  if(hadCache){
    render(); // immediate startup from last validated catalogue
    // Non-blocking freshness check. Only rerender if the canonical dataset changed.
    refreshCanonicalCatalog().then(r=>{if(r.changed)render()}).catch(()=>{});
    return;
  }
  loadingScreen();
  await refreshCanonicalCatalog({force:true});
  render();
}
function loadingScreen(){
 document.querySelector("#view").innerHTML=`<div class="content-panel cold-loader">
   <h2>${lang==="fr"?"Préparation de WuWa Companion":"Preparing WuWa Companion"}</h2>
   <p>${lang==="fr"?"Premier chargement : récupération et validation des données du jeu. Les ouvertures suivantes utiliseront le cache local validé.":"First load: fetching and validating game data. Following launches will use the validated local cache."}</p>
   <div class="load-track" role="progressbar" aria-label="${lang==="fr"?"Chargement":"Loading"}"><div class="load-bar"></div></div>
 </div>`;
}
function dataErrorScreen(err){
 document.querySelector("#view").innerHTML=`<div class="content-panel"><div class="empty"><b>${
   lang==="fr"?"Base de données indisponible":"Game database unavailable"
 }</b><br><br>${
   lang==="fr"
    ?"WuWa Companion refuse d’utiliser l’ancienne base manuelle ou des données incomplètes. Vérifie la connexion puis recharge la page."
    :"WuWa Companion refuses to use the old manual catalogue or incomplete data. Check the connection and reload."
 }</div></div>`;
 console.error("Canonical catalogue rejected:",err);
}

const PROFILE={name:"Earyon",uid:"534230812",playerId:"601844929",unionLevel:68,sol3Rank:7,birthday:"13/12"};
const detected=new Set(["Aalto","Aemeath","Baizhi","Buling","Calcharo","Changli","Chixia","Danjin","Denia","Encore","Jianxin","Lingyang","Lumi","Luuk Herssen","Lynae","Mortefi","Qingxiao","Sanhua","Suisui","Taoqi","Verina","Yangyang","Youhu","Yuanwu"]);
let owned=JSON.parse(localStorage.getItem("wwc_owned")||"[]");
let ownedIds=JSON.parse(localStorage.getItem("wwc_owned_ids")||"[]");
let accountData=JSON.parse(localStorage.getItem("wwc_account_data")||"{}");

function normalizedLookupName(v){
 return String(v||"")
   .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
   .toLowerCase()
   .replace(/[’‘`]/g,"'")
   .replace(/\bthe\b/g,"")
   .replace(/[^a-z0-9]+/g,"")
   .trim();
}
function resolveResonatorRef(ref){
 if(ref==null)return null;
 const raw=String(ref);
 let r=DATA.find(x=>x.id===raw||String(x.gameId||"")===raw||x.name===raw);
 if(r)return r;
 const key=normalizedLookupName(raw);
 return DATA.find(x=>normalizedLookupName(x.name)===key)||null;
}
function persistCanonicalOwnership(){
 ownedIds=[...new Set(ownedIds)].filter(id=>DATA.some(r=>r.id===id));
 owned=ownedIds.map(id=>DATA.find(r=>r.id===id)?.name).filter(Boolean);
 localStorage.setItem("wwc_owned_ids",JSON.stringify(ownedIds));
 // Keep legacy storage synced during prototype migration.
 localStorage.setItem("wwc_owned",JSON.stringify(owned));
}
function migrateOwnershipToCanonical(){
 if(!DATA.length)return;
 const resolvedIds=new Set();

 // New stable-ID storage wins.
 for(const id of ownedIds){
   const r=resolveResonatorRef(id);
   if(r)resolvedIds.add(r.id);
 }

 // Migrate the old name-based list.
 for(const name of owned){
   const r=resolveResonatorRef(name);
   if(r)resolvedIds.add(r.id);
 }

 // Recover characters that had account-specific data even if the old owned list
 // was lost/corrupted during a prototype catalogue migration.
 for(const name of Object.keys(accountData||{})){
   const r=resolveResonatorRef(name);
   if(r)resolvedIds.add(r.id);
 }

 ownedIds=[...resolvedIds];
 persistCanonicalOwnership();
}
let lang=localStorage.getItem("wwc_lang")||"fr";
let encySort="alpha";
let encySortDir=1;
let ownedSort="alpha";
let ownedSortDir=1;
let ownedElement="All";
let currentView="account", accountTab="res", element="All";

const I18N={
 fr:{daily:"Accueil",ency:"Encyclopédie",account:"Mon compte",planner:"Planner",more:"Plus",back:"Retour",res:"Mes Résonateurs",weap:"Mes Armes",echo:"Mes Échos",resources:"Mes Ressources"},
 en:{daily:"Home",ency:"Encyclopedia",account:"My Account",planner:"Planner",more:"More",back:"Back",res:"My Resonators",weap:"My Weapons",echo:"My Echoes",resources:"My Resources"}
};
const WEAPON_LABELS={fr:{Sword:"Sabre",Broadblade:"Épée",Pistols:"Pistolets",Gauntlets:"Gantelets",Rectifier:"Amplificateur",Unknown:"Inconnu"},en:{Sword:"Sword",Broadblade:"Broadblade",Pistols:"Pistols",Gauntlets:"Gauntlets",Rectifier:"Rectifier",Unknown:"Unknown"}};
const t=k=>I18N[lang][k]||k;
const weaponLabel=w=>(WEAPON_LABELS[lang]&&WEAPON_LABELS[lang][w])||w;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function setHeader(title,sub){
 document.querySelector("#pageTitle").textContent=title;
 document.querySelector("#pageSub").textContent=sub;
}

 document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===currentView));

 document.querySelectorAll(".bottom-nav small").forEach((x,i)=>x.textContent=labs[i]);
 document.querySelectorAll(".side-nav button span:last-child").forEach((x,i)=>x.textContent=labs[i]);
}
function accountTabs(){
 if(currentView!=="account"){document.querySelector("#accountTabs").innerHTML="";return}
 const tabs=[["res",t("res")],["weap",t("weap")],["echo",t("echo")],["resources",t("resources")]];
 document.querySelector("#accountTabs").innerHTML=`<div class="account-tabs">${tabs.map(([k,l])=>`<button class="${accountTab===k?"active":""}" onclick="accountTab='${k}';render()">${l}</button>`).join("")}</div>`;
}

function updateFilterButtons(containerSelector,value){
 const box=document.querySelector(containerSelector); if(!box)return;
 [...box.querySelectorAll("button")].forEach(btn=>{
   const txt=(btn.textContent||"").trim();
   const normalized=txt==="Tous"||txt==="All"?"All":txt;
   btn.classList.toggle("active",normalized===value);
 });
}
function setEncyElement(value){
 element=value;
 updateFilterButtons(".filter-sort-row .filters",value);
 drawCards();
}
function setOwnedElement(value){
 ownedElement=value;
 updateFilterButtons(".owned-filters",value);
 renderOwnedList();
}

function sortLabel(scope){
 const kind=scope==="ency"?encySort:ownedSort;
 const dir=scope==="ency"?encySortDir:ownedSortDir;
 if(kind==="alpha")return dir===1?"A → Z":"Z → A";
 return dir===-1?"5★ → 4★":"4★ → 5★";
}
function sortOptionLabel(scope,kind){
 const activeKind=scope==="ency"?encySort:ownedSort;
 const activeDir=scope==="ency"?encySortDir:ownedSortDir;
 if(kind==="alpha"){
   const dir=activeKind==="alpha"?activeDir:1;
   return dir===1?"A → Z":"Z → A";
 }
 const dir=activeKind==="rarity"?activeDir:-1;
 return dir===-1?"5★ → 4★":"4★ → 5★";
}
function sortDirectionHTML(label){
 const [from,to]=label.split(" → ");
 return `<span class="sort-direction"><span>${from}</span><svg class="sort-flow-arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8h12m-4-4 4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>${to}</span></span>`;
}
function sortDropdownHTML(scope){
 return `<div class="sort-dropdown">
   <button class="sort-trigger" aria-label="${sortLabel(scope)}" aria-haspopup="menu" aria-expanded="false" onclick="toggleSortMenu('${scope}',event)">
     ${sortDirectionHTML(sortLabel(scope))}<svg class="sort-caret" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
   </button>

const CHARACTER_DETAIL_CACHE_PREFIX="wwc_character_detail_v4:";
let editingSkills={};
let editingSkillDefs=[];
let skillDetailRequestToken=0;
const SKILL_ORDER=["Normal Attack","Skill","Forte Circuit","Liberation","Intro"];
const SKILL_LABELS={
 fr:{"Normal Attack":"Attaque normale","Skill":"Compétence de Résonance","Forte Circuit":"Circuit Forte","Liberation":"Libération de Résonance","Intro":"Compétence d’Intro"},
 en:{"Normal Attack":"Normal Attack","Skill":"Resonance Skill","Forte Circuit":"Forte Circuit","Liberation":"Resonance Liberation","Intro":"Intro Skill"}
};
function normalizeSkillType(v){
 const raw=content(v).trim().toLowerCase().replace(/resonance\s+/g,"");
 // Order matters: "Intro Skill", "Outro Skill" and "Inherent Skill"
 // must not be swallowed by the generic "skill" branch.
 if(raw.includes("intro"))return "Intro";
 if(raw.includes("outro"))return "Outro";
 if(raw.includes("inherent"))return "Inherent Skill";
 if(raw.includes("forte"))return "Forte Circuit";
 if(raw.includes("liberation"))return "Liberation";
 if(raw.includes("normal"))return "Normal Attack";
 if(raw==="skill"||raw.includes("skill"))return "Skill";
 return content(v).trim();
}
function skillIcon(v){return assetUrl(v)}
function normalizeSkillDefs(detail){
 const arr=Array.isArray(detail?.Skills)?detail.Skills:Array.isArray(detail?.skills)?detail.skills:[];
 const byType=new Map();
 for(const sk of arr){
   const rawType=first(sk,["SkillType","Type","type"]);
   const rawName=first(sk,["SkillName","Name","name"]);
   const type=normalizeSkillType(rawType)||normalizeSkillType(rawName);
   if(!SKILL_ORDER.includes(type) || byType.has(type))continue;
   byType.set(type,{
     id:String(first(sk,["Id","SkillId","id"])||type),
     type,
     icon:skillIcon(first(sk,["Icon","SkillIcon","SkillIconPath","IconPath","SkillIconUrl","icon"]))
   });
 }
 // Some API character payloads omit the Intro icon in Skills but expose it in SkillTree.
 const tree=Array.isArray(detail?.SkillTree)?detail.SkillTree:Array.isArray(detail?.skillTree)?detail.skillTree:[];
 for(const node of tree){
   const type=normalizeSkillType(first(node,["SkillType","Type","NodeType","type"]))||
              normalizeSkillType(first(node,["SkillName","Name","NodeName","name"]));
   if(!SKILL_ORDER.includes(type))continue;
   const icon=skillIcon(first(node,["Icon","SkillIcon","SkillIconPath","IconPath","NodeIcon","PropertyNodeIcon","icon"]));
   if(icon && (!byType.has(type)||!byType.get(type).icon)){
     const previous=byType.get(type)||{id:String(first(node,["Id","SkillId","NodeId","id"])||type),type,icon:""};
     previous.icon=icon; byType.set(type,previous);
   }
 }
 // The control remains visible even if upstream data is temporarily incomplete.
 return SKILL_ORDER.map(type=>byType.get(type)||{id:type,type,icon:""});
}
function characterDetailCacheKey(gameId){return CHARACTER_DETAIL_CACHE_PREFIX+String(gameId)}
function readCharacterDetailCache(gameId){
 try{
   const x=JSON.parse(localStorage.getItem(characterDetailCacheKey(gameId))||"null");
   return x?.detail||null;
 }catch(e){return null}
}

const ROVER_SKILL_SIBLING={
 "1406":"1408","1408":"1406",
 "1501":"1502","1502":"1501",
 "1604":"1605","1605":"1604"
};
function coreSkillCount(detail){
 const defs=normalizeSkillDefsRaw(detail);
 return defs.length;
}
function normalizeSkillDefsRaw(detail){
 const arr=Array.isArray(detail?.Skills)?detail.Skills:Array.isArray(detail?.skills)?detail.skills:[];
 const seen=new Set(), out=[];
 for(const sk of arr){
   const type=normalizeSkillType(first(sk,["SkillType","Type","type"]))||normalizeSkillType(first(sk,["SkillName","Name","name"]));
   if(SKILL_ORDER.includes(type)&&!seen.has(type)){seen.add(type);out.push(type)}
 }
 return out;
}
async function backfillRoverDetail(gameId,detail){
 const sibling=ROVER_SKILL_SIBLING[String(gameId)];
 if(!sibling || coreSkillCount(detail)>=5)return detail;
 try{
   const sib=await fetchJSON(`${ENCORE_BASE}/en/character/${encodeURIComponent(sibling)}`);
   const merged={...detail};
   if((!Array.isArray(merged.Skills)||coreSkillCount(merged)<5)&&Array.isArray(sib?.Skills))merged.Skills=sib.Skills;
   if((!Array.isArray(merged.SkillTree)||!merged.SkillTree.length)&&Array.isArray(sib?.SkillTree))merged.SkillTree=sib.SkillTree;
   return merged;
 }catch(e){
   return detail;
 }
}

async function getCharacterDetail(gameId,{background=false}={}){
 const cached=readCharacterDetailCache(gameId);
 if(cached && !background)return {detail:cached,fromCache:true};
 let detail=await fetchJSON(`${ENCORE_BASE}/en/character/${encodeURIComponent(gameId)}`);
 detail=await backfillRoverDetail(gameId,detail);
 localStorage.setItem(characterDetailCacheKey(gameId),JSON.stringify({savedAt:new Date().toISOString(),detail}));
 return {detail,fromCache:false};
}

async function loadEditorSkills(resonator){
 const token=++skillDetailRequestToken;

 if(!resonator?.gameId){drawSkillsEditor("error");return}

   const cached=readCharacterDetailCache(resonator.gameId);
   if(cached){
     editingSkillDefs=normalizeSkillDefs(cached);
     if(token===skillDetailRequestToken)drawSkillsEditor();
     // refresh detail in background, never block the editor
     getCharacterDetail(resonator.gameId,{background:true}).then(({detail})=>{
       if(token!==skillDetailRequestToken)return;
       const next=normalizeSkillDefs(detail);
       if(next.length){editingSkillDefs=next;drawSkillsEditor()}
     }).catch(()=>{});
     return;
   }
   const {detail}=await getCharacterDetail(resonator.gameId);
   if(token!==skillDetailRequestToken)return;
   editingSkillDefs=normalizeSkillDefs(detail);

   if(token===skillDetailRequestToken)drawSkillsEditor("error");
 }
}

   "Firstlight's Herald":"FirstlightsHerald.png",
   "Defier's Thorn":"DefiersThorn.png",
   "Moongazer's Sigil":"MoongazersSigil.png",
   "Bloodpact's Pledge":"BloodpactsPledge.png",
   "Starfield Calibrator":"StarfieldCalibrator.png",
   "Lux & Umbra":"LuxUmbra.png"
 };
 return [...new Set([
   current,
   explicit[raw]?base+explicit[raw]:null,
   base+title+".png",
   base+keep+".png",
   base+lowerConnectors+".png",
   base+title+".webp",
   base+keep+".webp"
 ].filter(Boolean))];
}
function setWeaponImage(img,name,current){
 img.dataset.weaponName=name||"";
 img.dataset.candidates=JSON.stringify(weaponImageCandidates(name,current));
 img.dataset.tryIndex="0";
 img.src=weaponImageCandidates(name,current)[0]||"";
}
function weaponImgFallback(img){
 let arr=[];
 try{arr=JSON.parse(img.dataset.candidates||"[]")}catch(e){}
 let i=(parseInt(img.dataset.tryIndex||"0",10)||0)+1;
 if(i<arr.length){
   img.dataset.tryIndex=String(i);
   img.src=arr[i];
   return;
 }
 img.style.display="none";
 const wrap=img.parentElement;
 const fb=wrap?.querySelector(".weapon-fallback");
 if(fb) fb.style.display="grid";
}
function currentResonatorWeaponType(){
 const x=DATA.find(v=>v.name===editingName); return x?.weapon||null;
}
function openWeaponPicker(){
 const type=currentResonatorWeaponType();
 const compatibleCount=WEAPONS.filter(w=>w.type===type).length;
 document.querySelector("#weaponPickerTitle").textContent=(lang==="fr"?`Choisir une ${weaponLabel(type)}`:`Choose a ${weaponLabel(type)}`)+` · ${compatibleCount}`;
 document.querySelector("#weaponQ").placeholder=lang==="fr"?"Rechercher une arme…":"Search a weapon…";
 document.querySelector("#weaponQ").value="";
 drawWeapons();
 document.querySelector("#weaponPicker").classList.add("open");
}
function drawWeapons(){
 const q=(document.querySelector("#weaponQ").value||"").toLowerCase();
 const type=currentResonatorWeaponType();
 const list=WEAPONS
   .filter(w=>w.type===type && w.name.toLowerCase().includes(q))
   .sort((a,b)=>(b.rarity-a.rarity)||a.name.localeCompare(b.name));
 document.querySelector("#weaponGrid").innerHTML=list.length?list.map(w=>`<button class="weapon-card" onclick="selectWeaponByIndex(${WEAPONS.indexOf(w)})"><div class="weapon-img-wrap"><img src="${w.image}" alt="${esc(w.name)}" loading="lazy" decoding="async" fetchpriority="low" data-candidates='${JSON.stringify(weaponImageCandidates(w.name,w.image))}' data-try-index="0" onerror="weaponImgFallback(this)"><span class="weapon-fallback">◇</span></div><b>${esc(w.name)}</b><small>${"★".repeat(w.rarity)}</small></button>`).join(""):`<div class="empty">${lang==="fr"?"Aucune arme compatible trouvée dans le catalogue actuel.":"No compatible weapon found in the current catalogue."}</div>`;
}
function selectWeaponByIndex(i){
 const w=WEAPONS[i], expected=currentResonatorWeaponType();
 if(!w || w.type!==expected) return;
 selectWeapon(w.name);
}
function selectWeapon(name){
 editingWeapon=name; editingWeaponLevel=null; editingWeaponRank=1;
 document.querySelector("#weaponPicker").classList.remove("open");
 updateEditorControls();
}
function openWeaponLevelPicker(){
 document.querySelector("#weaponLevelTitle").textContent=lang==="fr"?"Niveau de l’arme":"Weapon level";
 document.querySelector("#weaponLevelQ").placeholder=lang==="fr"?"Rechercher un niveau…":"Search a level…";
 document.querySelector("#weaponLevelQ").value="";
 drawWeaponLevels();
 document.querySelector("#weaponLevelPicker").classList.add("open");
}
function drawWeaponLevels(){
 const q=(document.querySelector("#weaponLevelQ").value||"").trim();
 const nums=Array.from({length:90},(_,i)=>i+1).filter(n=>!q||String(n).includes(q));
 document.querySelector("#weaponLevelGrid").innerHTML=nums.map(n=>`<button class="level-btn ${editingWeaponLevel===n?"active":""}" onclick="editingWeaponLevel=${n};document.querySelector('#weaponLevelPicker').classList.remove('open');updateEditorControls()">${n}</button>`).join("");
}
function openLevelPicker(){
 document.querySelector("#levelPickerTitle").textContent=lang==="fr"?"Choisir le niveau":"Choose level";
 document.querySelector("#levelQ").placeholder=lang==="fr"?"Rechercher un niveau…":"Search a level…";
 document.querySelector("#levelQ").value="";
 drawLevels();
 document.querySelector("#levelPicker").classList.add("open");
}
function drawLevels(){
 const q=(document.querySelector("#levelQ").value||"").trim();
 const nums=Array.from({length:90},(_,i)=>i+1).filter(n=>!q||String(n).includes(q));
 document.querySelector("#levelGrid").innerHTML=nums.map(n=>`<button class="level-btn ${editingLevel===n?"active":""}" onclick="editingLevel=${n};document.querySelector('#levelPicker').classList.remove('open');updateEditorControls()">${n}</button>`).join("");
}
function saveAccountEditor(){
 if(!editingName)return;
 accountData[editingName]={...(accountData[editingName]||{}),level:editingLevel,sequence:editingSeq,weapon:editingWeapon?{name:editingWeapon,level:editingWeaponLevel,rank:editingWeaponRank}:null,skills:{...editingSkills}};
 localStorage.setItem("wwc_account_data",JSON.stringify(accountData));
 document.querySelector("#accountEditor").classList.remove("open");
 render();
}
function renderOwnedList(){
 const listEl=document.querySelector("#ownedList"); if(!listEl)return;
 const q=(document.querySelector("#ownedSearch")?.value||"").toLowerCase().trim();
 let rows=ownedIds.map(id=>DATA.find(v=>v.id===id)).filter(Boolean);
 if(q) rows=rows.filter(x=>x.name.toLowerCase().includes(q));
 if(ownedElement!=="All")rows=rows.filter(x=>x.element===ownedElement);
 rows.sort((a,b)=>{
   const alpha=a.name.localeCompare(b.name,lang==="fr"?"fr":"en",{sensitivity:"base"});
   if(ownedSort==="alpha")return ownedSortDir*alpha;
   const rarity=(Number(a.rarity)-Number(b.rarity))*ownedSortDir;
   return rarity||alpha;
 });
 listEl.innerHTML=rows.length?rows.map(x=>`<div class="res-row" style="--element:${x.element==="Fusion"?"#ff826d":x.element==="Aero"?"#6ce1d2":x.element==="Spectro"?"#ffe08a":x.element==="Glacio"?"#76d7ff":x.element==="Electro"?"#b99aff":"#d676ff"}">
   <img src="${x.image||""}" alt="${esc(x.name)}" loading="lazy" decoding="async" fetchpriority="low">
   <div class="res-main"><b>${esc(x.name)}</b><div class="res-meta"><span class="element">✦ ${x.element}</span><span>${weaponLabel(x.weapon)}</span></div><div class="rarity-stars">${"★".repeat(x.rarity)}</div></div>
   <div class="status">${accountStatus(x.name)}</div>
   <button class="remove-res trash-btn" title="${lang==="fr"?"Retirer":"Remove"}" aria-label="${lang==="fr"?"Retirer "+esc(x.name):"Remove "+esc(x.name)}" onclick='event.stopPropagation();removeOwned(${JSON.stringify(x.name)})'>
     <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 2h4v2H4V5h4l1-2Zm-2 6h10l-.8 11H7.8L7 9Zm3 2v7h2v-7h-2Zm4 0v7h2v-7h-2Z"/></svg>
   </button>
   <button class="chev edit-chevron" title="${lang==="fr"?"Modifier":"Edit"}" aria-label="${lang==="fr"?"Modifier "+esc(x.name):"Edit "+esc(x.name)}" onclick='openAccountEditor(${JSON.stringify(x.name)})'>›</button>
 </div>`).join(""):`<div class="empty">${q?(lang==="fr"?"Aucun Résonateur ne correspond à la recherche.":"No Resonator matches your search."):(lang==="fr"?"Aucun Résonateur confirmé.":"No confirmed Resonator yet.")}</div>`;
 const footer=document.querySelector(".footer-row span");
 if(footer) footer.textContent=lang==="fr"?`Affichage : ${rows.length} sur ${ownedIds.length}`:`Showing: ${rows.length} of ${ownedIds.length}`;
}
function removeOwned(name){
 const msg=lang==="fr"?`Retirer ${name} de Mes Résonateurs ?`:`Remove ${name} from My Resonators?`;
 if(!confirm(msg))return;
 const r=resolveResonatorRef(name);
 if(r)ownedIds=ownedIds.filter(id=>id!==r.id);
 persistCanonicalOwnership();
 render();
}
function filterOwned(){ renderOwnedList(); }
function openSelector(){
 document.querySelector("#selectorTitle").textContent=lang==="fr"?"Ajouter un Résonateur":"Add a Resonator";
 document.querySelector("#selectorQ").placeholder=lang==="fr"?"Rechercher un Résonateur…":"Search a Resonator…";
 document.querySelector("#selectorQ").value="";
 document.querySelector("#selector").classList.add("open");drawSelector();
}
function drawSelector(){
 const q=(document.querySelector("#selectorQ").value||"").toLowerCase();
 const list=DATA
   .filter(x=>!ownedIds.includes(x.id)&&x.name.toLowerCase().includes(q))
   .sort((a,b)=>(Number(b.rarity)-Number(a.rarity))||a.name.localeCompare(b.name,lang==="fr"?"fr":"en",{sensitivity:"base"}));
 document.querySelector("#selectorGrid").innerHTML=list.map(x=>`<button class="select-card ${detected.has(x.name)?"detected":""}" onclick='confirmOwned(${JSON.stringify(x.name)})'>${x.image?`<img src="${x.image}" alt="${esc(x.name)}">`:""}<span>${esc(x.name)}</span></button>`).join("");
}
function confirmOwned(name){
 const r=resolveResonatorRef(name);
 if(r&&!ownedIds.includes(r.id)){ownedIds.push(r.id);persistCanonicalOwnership()}
 document.querySelector("#selector").classList.remove("open");render();
}
function openDetail(name){
 const x=DATA.find(v=>v.name===name);if(!x)return;
 document.querySelector("#detailContent").innerHTML=`<div class="detailhero">${x.image?`<img src="${x.image}" alt="${esc(x.name)}">`:""}<div class="detailcopy"><div style="color:#f0d48b">${x.element} · ${weaponLabel(x.weapon)} · ${"★".repeat(x.rarity)}</div><h1>${esc(x.name)}</h1><p>${ownedIds.includes(x.id)?(lang==="fr"?"Possédé":"Owned"):name==="Hiyuki"?(lang==="fr"?"Souhait · non possédée":"Wishlist · not owned"):(lang==="fr"?"Statut inconnu":"Unknown status")}</p></div></div><div class="actions"><button class="action wish"><svg viewBox="0 0 24 24"><path d="M12 20.4 4.2 13C.8 9.8 2.4 4.5 6.8 4.5c2.1 0 3.7 1.2 5.2 3 1.5-1.8 3.1-3 5.2-3 4.4 0 6 5.3 2.6 8.5L12 20.4Z"/></svg>${lang==="fr"?"Souhait":"Wishlist"}</button><button class="action primary"><svg viewBox="0 0 24 24"><path d="M12 2.5 18.2 19 12 15.8 5.8 19 12 2.5Z" fill="currentColor"/></svg>${lang==="fr"?"Améliorer":"Improve"}</button></div>`;
 document.querySelector("#detail").classList.add("open");
}
function setLang(v){lang=v;localStorage.setItem("wwc_lang",v);render()}
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{currentView=b.dataset.view;render()});
document.querySelector("#selectorClose").onclick=()=>document.querySelector("#selector").classList.remove("open");
document.querySelector("#editorClose").onclick=()=>document.querySelector("#accountEditor").classList.remove("open");
document.querySelector("#levelPickerClose").onclick=()=>document.querySelector("#levelPicker").classList.remove("open");
document.querySelector("#weaponPickerClose").onclick=()=>document.querySelector("#weaponPicker").classList.remove("open");
document.querySelector("#weaponLevelClose").onclick=()=>document.querySelector("#weaponLevelPicker").classList.remove("open");
document.querySelector("#back").onclick=()=>document.querySelector("#detail").classList.remove("open");

function auditCompanionData(){
 const allowed=new Set(["Broadblade","Gauntlets","Pistols","Rectifier","Sword"]);
 const problems=[];
 DATA.forEach(x=>{if(!allowed.has(x.weapon))problems.push(`Resonator ${x.name}: ${x.weapon}`)});
 WEAPONS.forEach(w=>{
   if(!allowed.has(w.type))problems.push(`Weapon ${w.name}: invalid type ${w.type}`);
   if(![1,2,3,4,5].includes(Number(w.rarity)))problems.push(`Weapon ${w.name}: invalid rarity ${w.rarity}`);
 });
 window.__WWC_AUDIT__={ok:problems.length===0,problems,resonators:DATA.length,weapons:WEAPONS.length};
 return window.__WWC_AUDIT__;
}
auditCompanionData();



bootstrapCanonicalCatalog().catch(err=>dataErrorScreen(err));
</script>
